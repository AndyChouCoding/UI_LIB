# Publishes packages/tokens on every GitHub Release. Once packages/ui exists,
# this will need to target the specific package being released instead of
# always publishing packages/tokens.
name: Publish Package

on:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@andychoucoding'

      - run: npm ci
      - run: npm run build --workspace=packages/tokens
      - run: npm publish --workspace=packages/tokens
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
